name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '2.7', toxenv: py27, image: 'python:2.7.18-buster'}
          - {python: '3.5', toxenv: py35, image: 'python:3.5.10-buster'}
          - {python: '3.6', toxenv: py36, image: 'python:3.6.15-buster'}
          - {python: '3.7', toxenv: py37, image: 'python:3.7.17-bullseye'}
          - {python: '3.8', toxenv: py38}
          - {python: '3.9', toxenv: py39}
          - {python: '3.10', toxenv: py310}
          - {python: '3.11', toxenv: py311}
          - {python: '3.12', toxenv: py312}
          - {python: '3.13', toxenv: py313}
          - {python: '3.14', toxenv: py314}
          - {python: '3.15', toxenv: py315}

    name: Python ${{ matrix.python }}
    env:
      TOXENV: ${{ matrix.toxenv }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Set up PHP 8.4
        if: matrix.toxenv == 'py314'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Require the PHP CLI
        if: matrix.toxenv == 'py314'
        run: |
          php --version
          echo "PHP_BINARY=$(command -v php)" >> "$GITHUB_ENV"
      - name: Test on the runner
        if: ${{ !matrix.image }}
        run: |
          python -m pip install 'tox>=4'
          python -m tox
      - name: Test in the legacy Python image
        if: ${{ matrix.image }}
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --env TOXENV --volume "$PWD:/project" --workdir /project "$PYTHON_IMAGE" \
            sh -ec 'python -m pip install "tox<4" && python -m tox'
      - uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: coverage-${{ matrix.toxenv }}
          path: .tox/${{ matrix.toxenv }}/htmlcov
          if-no-files-found: error
