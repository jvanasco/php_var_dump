[metadata]
name = php_var_dump
version = attr: php_var_dump.__VERSION__
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/php_var_dump
description = A port of the var_dump function of PHP to Python. This lets you make PHP files with Python.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: PHP
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.5
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*
packages = find:
package_dir =
    = src
include_package_data = true
zip_safe = false
install_requires =
    six

[options.packages.find]
where = src

[options.extras_require]
testing =
    pytest
    coverage

[tox:tox]
envlist = py27, py35, py36, py37, py38, py39, py310, py311, py312, py313, py314, py315
isolated_build = true

[testenv]
package = wheel
extras = testing
passenv =
    CI
    PHP_BINARY
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    python --version
    python -m coverage run --source=php_var_dump -m pytest {posargs}
    python -m coverage html -d {envdir}/htmlcov
